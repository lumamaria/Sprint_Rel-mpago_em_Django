<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Projetos</title>
</head>
<body>

    <h1>Projetos cadastrados</h1>

    <a href="{% url 'cadastrar_projeto' %}">Cadastrar novo projeto</a>

    <ul>
        {% for projeto in projetos %}
            <li>
                <strong>{{ projeto.nome }}</strong><br>
                {{ projeto.descricao }}<br>
                {{ projeto.data_inicio }}
            </li>
        {% empty %}
            <li>Nenhum projeto cadastrado.</li>
        {% endfor %}
    </ul>

</body>
</html>
