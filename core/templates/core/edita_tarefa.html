{% extends 'base.html' %}
{% load static %}

{% block title %}Editar Tarefa{% endblock %}

{% block extra_css %}
<link rel="stylesheet" href="{% static 'css/cadas_edita.css' %}">
{% endblock %}

{% block content %}

<h1>Editar Tarefa</h1>

<form method="post">
    {% csrf_token %}

    {{ form.as_p }}

    <button type="submit">Salvar alterações</button>
</form>

<a href="{% url 'listar_tarefas' %}">Voltar para tarefas</a>

{% endblock %}
