{% extends 'base.html' %}
{% load static %}

{% block title %}Cadastrar Projeto{% endblock %}

{% block extra_css %}
<link rel="stylesheet" href="{% static 'css/cadas_edita.css' %}">
{% endblock %}

{% block content %}

<div class="formulario-container">

    <h1>Cadastrar Projeto</h1>

    <form method="post">
        {% csrf_token %}

        {{ form.as_p }}

        <button type="submit">Cadastrar</button>
    </form>

    <a class="voltar" href="{% url 'listar_projetos' %}">
        Voltar para projetos
    </a>

</div>

{% endblock %}
