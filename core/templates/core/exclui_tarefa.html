<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Excluir Tarefa</title>
</head>
<body>

    <h1>Excluir Tarefa</h1>

    <p>Tem certeza que deseja excluir a tarefa "{{ tarefa.titulo }}"?</p>

    <form method="post">
        {% csrf_token %}

        <button type="submit">Sim, excluir</button>
    </form>

    <a href="{% url 'listar_tarefas' %}">Cancelar</a>

</body>
</html>
